name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Detect project directory
        id: detect
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "AlphaPool/settings.gradle.kts" ] || [ -f "AlphaPool/settings.gradle" ]; then
            echo "dir=AlphaPool" >> $GITHUB_OUTPUT
          else
            echo "Could not find settings.gradle(.kts). Repository contents:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.dir }}"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaPool-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            AlphaPool/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
